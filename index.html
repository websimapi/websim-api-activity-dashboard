<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@api Activity Slideshow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .profile-corner {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 15px 20px;
            border-radius: 50px;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .profile-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .profile-name {
            font-weight: 600;
            font-size: 1.1em;
            color: #fff;
        }

        .recent-tag {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: 600;
            z-index: 100;
            transform: translateY(-100px);
            transition: all 0.5s ease;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);
        }

        .recent-tag.show {
            transform: translateY(0);
        }

        .slideshow-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 0;
            padding: 60px 40px 120px 40px;
            color: #333;
            position: relative;
            backdrop-filter: blur(20px);
            box-shadow: none;
            animation: slideIn 0.8s ease-out;
        }

        .slide.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .slide-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 30px;
        }

        .project-title {
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .project-meta {
            color: #666;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .project-status {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .status-posted {
            background: #e8f5e8;
            color: #2d5d31;
        }

        .status-draft {
            background: #fff4e6;
            color: #b56500;
        }

        .status-private {
            background: #f0f0f0;
            color: #666;
        }

        .slide-content {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 60px;
            height: calc(100% - 120px);
        }

        .project-thumbnail {
            background: #f8f9fa;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            color: #666;
            border: 2px solid #e9ecef;
            overflow: hidden;
            min-height: 400px;
        }

        .thumbnail-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
        }

        .project-info {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .prompt-section {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 25px;
            border-radius: 20px;
            flex-grow: 1;
        }

        .prompt-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .prompt-text {
            font-size: 1.1em;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            border-left: 4px solid rgba(255, 255, 255, 0.3);
        }

        .prompt-type {
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 10px;
            font-style: italic;
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: rgba(102, 126, 234, 0.1);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .navigation {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .nav-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            z-index: 100;
            transition: width 0.1s linear;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 1.5em;
            color: rgba(255, 255, 255, 0.8);
        }

        @media (max-width: 768px) {
            .slide-content {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            
            .slide {
                width: 100%;
                padding: 40px 20px 120px 20px;
                height: 100vh;
            }
            
            .project-title {
                font-size: 1.8em;
            }

            .project-thumbnail {
                min-height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="profile-corner" id="profileCorner" style="display: none;">
        <img id="profileAvatar" class="profile-avatar" alt="@api">
        <div class="profile-name">@api</div>
    </div>

    <div class="recent-tag" id="recentTag">Most Recent</div>

    <div class="slideshow-container" id="slideshowContainer">
        <div class="loading" id="loading">Loading @api's latest projects...</div>
    </div>

    <div class="navigation">
        <button class="nav-btn" id="prevBtn" onclick="previousSlide()">‹</button>
        <button class="nav-btn" id="playPauseBtn" onclick="toggleAutoplay()">⏸</button>
        <button class="nav-btn" id="nextBtn" onclick="nextSlide()">›</button>
    </div>

    <div class="progress-bar" id="progressBar"></div>

    <script>
        let allProjects = [];
        let currentSlideIndex = 0;
        let autoplayInterval = null;
        let isAutoPlaying = true;
        let progressInterval = null;
        let progressWidth = 0;
        const SLIDE_DURATION = 7000; // 7 seconds

        async function loadUserData() {
            try {
                // Load user info
                const userResponse = await fetch('/api/v1/users/api');
                const userData = await userResponse.json();
                
                // Show profile corner
                document.getElementById('profileAvatar').src = `https://images.websim.com/avatar/${userData.user.username}`;
                document.getElementById('profileCorner').style.display = 'flex';

                // Load all projects
                await loadProjects();
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loading').innerHTML = 'Error loading @api data';
            }
        }

        async function loadProjects() {
            try {
                const projectsResponse = await fetch('/api/v1/users/api/projects?first=50&sort_by=updated_at');
                const projectsData = await projectsResponse.json();
                allProjects = projectsData.projects.data;
                
                if (allProjects.length > 0) {
                    createSlides();
                    showSlide(0);
                    startAutoplay();
                } else {
                    document.getElementById('loading').innerHTML = 'No projects found for @api';
                }
            } catch (error) {
                throw error;
            }
        }

        function createSlides() {
            const container = document.getElementById('slideshowContainer');
            container.innerHTML = '';

            allProjects.forEach((item, index) => {
                const project = item.project;
                const site = item.site;
                
                const statusClass = project.posted ? 'status-posted' : 
                                  project.visibility === 'private' ? 'status-private' : 'status-draft';
                const statusText = project.posted ? 'Posted' : 
                                 project.visibility === 'private' ? 'Private' : 'Draft';

                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.innerHTML = `
                    <div class="slide-header">
                        <div>
                            <div class="project-title">${project.title || 'Untitled Project'}</div>
                            <div class="project-meta">
                                Updated: ${new Date(project.updated_at).toLocaleDateString()}<br>
                                Version: ${project.current_version || 'N/A'} • ${project.slug ? `/${project.slug}` : 'No slug'}
                            </div>
                        </div>
                        <div class="project-status ${statusClass}">${statusText}</div>
                    </div>
                    
                    <div class="slide-content">
                        <div class="project-thumbnail">
                            ${site ? `<img class="thumbnail-image" src="https://images.websim.com/v1/site/${site.id}/600" alt="Project thumbnail" onerror="this.style.display='none'; this.parentElement.innerHTML='📄 Project Preview'">` : '📄 No Preview Available'}
                        </div>
                        
                        <div class="project-info">
                            ${site && site.prompt ? `
                                <div class="prompt-section">
                                    <div class="prompt-title">Latest Prompt</div>
                                    <div class="prompt-text">
                                        "${site.prompt.text || 'No prompt text available'}"
                                        ${site.prompt.type ? `<div class="prompt-type">Type: ${site.prompt.type}</div>` : ''}
                                    </div>
                                </div>
                            ` : `
                                <div class="prompt-section">
                                    <div class="prompt-title">Project Description</div>
                                    <div class="prompt-text">
                                        ${project.description || 'No description available'}
                                    </div>
                                </div>
                            `}
                            
                            <div class="stats-section">
                                <div class="stat-item">
                                    <div class="stat-number">${project.stats.views}</div>
                                    <div class="stat-label">Views</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-number">${project.stats.likes}</div>
                                    <div class="stat-label">Likes</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-number">${project.stats.comments}</div>
                                    <div class="stat-label">Comments</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                container.appendChild(slide);
            });
        }

        function showSlide(index) {
            const slides = document.querySelectorAll('.slide');
            slides.forEach(slide => slide.classList.remove('active'));
            
            if (slides[index]) {
                slides[index].classList.add('active');
                currentSlideIndex = index;
                
                // Show/hide recent tag
                const recentTag = document.getElementById('recentTag');
                if (index === 0) {
                    recentTag.classList.add('show');
                } else {
                    recentTag.classList.remove('show');
                }
                
                // Update navigation buttons
                document.getElementById('prevBtn').disabled = index === 0;
                document.getElementById('nextBtn').disabled = index === slides.length - 1;
            }
        }

        function nextSlide() {
            if (currentSlideIndex < allProjects.length - 1) {
                showSlide(currentSlideIndex + 1);
                resetProgress();
            }
        }

        function previousSlide() {
            if (currentSlideIndex > 0) {
                showSlide(currentSlideIndex - 1);
                resetProgress();
            } else if (currentSlideIndex === 0) {
                // Re-query for new projects when going back to front
                checkForUpdates();
            }
        }

        async function checkForUpdates() {
            try {
                const projectsResponse = await fetch('/api/v1/users/api/projects?first=50&sort_by=updated_at');
                const projectsData = await projectsResponse.json();
                const newProjects = projectsData.projects.data;
                
                if (newProjects.length > allProjects.length || 
                    (newProjects[0] && allProjects[0] && newProjects[0].project.id !== allProjects[0].project.id)) {
                    
                    allProjects = newProjects;
                    createSlides();
                    showSlide(0);
                    resetProgress();
                }
            } catch (error) {
                console.error('Error checking for updates:', error);
            }
        }

        function toggleAutoplay() {
            const btn = document.getElementById('playPauseBtn');
            if (isAutoPlaying) {
                stopAutoplay();
                btn.innerHTML = '▶';
            } else {
                startAutoplay();
                btn.innerHTML = '⏸';
            }
            isAutoPlaying = !isAutoPlaying;
        }

        function startAutoplay() {
            stopAutoplay(); // Clear any existing intervals
            
            autoplayInterval = setInterval(() => {
                if (currentSlideIndex < allProjects.length - 1) {
                    nextSlide();
                } else {
                    showSlide(0); // Loop back to first slide
                    resetProgress();
                }
            }, SLIDE_DURATION);
            
            startProgress();
        }

        function stopAutoplay() {
            if (autoplayInterval) {
                clearInterval(autoplayInterval);
                autoplayInterval = null;
            }
            stopProgress();
        }

        function startProgress() {
            stopProgress();
            progressWidth = 0;
            
            progressInterval = setInterval(() => {
                progressWidth += (100 / (SLIDE_DURATION / 100));
                if (progressWidth >= 100) {
                    progressWidth = 100;
                }
                document.getElementById('progressBar').style.width = progressWidth + '%';
            }, 100);
        }

        function stopProgress() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function resetProgress() {
            progressWidth = 0;
            document.getElementById('progressBar').style.width = '0%';
            if (isAutoPlaying) {
                startProgress();
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft':
                    previousSlide();
                    break;
                case 'ArrowRight':
                    nextSlide();
                    break;
                case ' ':
                    e.preventDefault();
                    toggleAutoplay();
                    break;
            }
        });

        // Load data when page loads
        loadUserData();
    </script>

</body>
